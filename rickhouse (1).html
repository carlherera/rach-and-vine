<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rickhouse">
<meta name="theme-color" content="#17110d">
<title>Rickhouse</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17110d; --surface:#241a14; --surface2:#2f231b; --well:#2a1e16;
  --line:#3a2c22; --line2:#4a382b; --text:#f3e9df; --muted:#b9a796; --soft:#e6d8ca;
  --accent:#e0a24a; --on-accent:#1a120c; --sealed:#6b5644; --danger:#e3735e;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.serif{font-family:Fraunces,Georgia,serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}

/* layout */
.screen{min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(96px + var(--bot))}
.pad{padding:0 20px}
.top{padding:calc(var(--top) + 20px) 20px 16px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:34px;line-height:1.05}
h2{margin:0;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:22px}

.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn.ghost{border:0;background:rgba(23,17,13,.75)}
.iconbtn svg{width:20px;height:20px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:Fraunces,Georgia,serif;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}

.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:44px}
.search input{flex:1;background:transparent;border:0;outline:none;font-size:16px;color:var(--text)}
.search input::placeholder{color:#8f7d6d}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--soft);font-weight:600;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.list{display:flex;flex-direction:column;gap:10px;padding:4px 20px 20px}
.card{background:var(--surface);border:0;border-radius:16px;padding:12px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.thumb{width:52px;height:64px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.card .name{font-family:Fraunces,Georgia,serif;font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.status{font-size:12px;color:var(--muted);width:56px;text-align:right}
.pill{font-size:13px;font-weight:600;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:4px 9px;flex-shrink:0}
.empty{padding:48px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:center}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(84px + var(--bot));padding:10px 28px calc(var(--bot) + 18px);background:#1f1611;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;z-index:20}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:500;min-width:64px}
.tab.on{color:var(--accent);font-weight:600}
.tab svg{width:24px;height:24px}
.fab{width:60px;height:60px;border-radius:30px;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.fab svg{width:26px;height:26px}

/* detail */
.hero{height:calc(300px + var(--top));position:relative;background:var(--well);display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:contain}
.hero .nav{position:absolute;top:calc(var(--top) + 12px);left:16px;right:16px;display:flex;justify-content:space-between}
.dots{position:absolute;bottom:14px;right:16px;display:flex;gap:4px}
.dots button{width:28px;height:28px;border:0;background:none;display:flex;align-items:center;justify-content:center;padding:0}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--sealed)}
.dots .on i{background:var(--accent)}
.body{padding:20px;display:flex;flex-direction:column;gap:18px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts span{font-size:12px;color:var(--muted)}
.facts b{font-family:Fraunces,Georgia,serif;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:transparent;color:var(--soft);font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--on-accent)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.kv{background:var(--surface);border-radius:16px;padding:4px 16px}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted);flex-shrink:0}
.kv span:last-child{text-align:right}
.notes{font-size:14px;line-height:1.5;color:var(--soft);white-space:pre-wrap}

.btn{height:52px;border-radius:14px;border:1px solid var(--line2);background:transparent;color:var(--text);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger);border-color:#5a2f27}
.btn:disabled{opacity:.5}

/* form */
.formtop{padding:calc(var(--top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
.fields{padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field .lab{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.field .flag{color:var(--accent);font-weight:600}
.field input,.field select,.field textarea{min-height:44px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:16px;outline:none;width:100%}
.field textarea{min-height:88px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field.flagged input,.field.flagged select{border-color:var(--accent)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.photos{display:flex;gap:8px}
.photos div{flex:1;height:96px;border-radius:12px;background:var(--well);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);overflow:hidden}
.photos img{width:100%;height:100%;object-fit:cover}
.footer{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(var(--bot) + 20px);display:flex;gap:10px;border-top:1px solid var(--line);background:#1f1611;z-index:20}
.footer .btn{flex:1}.footer .btn.primary{flex:2}

/* scan */
.scan{min-height:100vh;background:#0d0907;display:flex;flex-direction:column;padding-bottom:calc(var(--bot) + 24px)}
.slots{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:8px 16px}
.slot{position:relative;border-radius:22px;background:var(--well);border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--soft);font-size:14px;font-weight:600;min-height:320px;overflow:hidden;padding:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .tag{position:absolute;left:10px;top:10px;background:rgba(13,9,7,.8);border-radius:999px;padding:4px 10px;font-size:12px}
.slot .corners{position:absolute;inset:14px;pointer-events:none}.slot .corners i{position:absolute;width:24px;height:24px;border:0 solid var(--accent)}.slot .corners i:nth-child(1){top:0;left:0;border-top-width:2px;border-left-width:2px}.slot .corners i:nth-child(2){top:0;right:0;border-top-width:2px;border-right-width:2px}.slot .corners i:nth-child(3){bottom:0;right:0;border-bottom-width:2px;border-right-width:2px}.slot .corners i:nth-child(4){bottom:0;left:0;border-bottom-width:2px;border-left-width:2px}
.scanhint{padding:12px 24px;text-align:center;font-size:14px;color:var(--muted);line-height:1.5}
.scanactions{padding:0 16px;display:flex;flex-direction:column;gap:10px}

/* sheet & toast & loader */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px calc(var(--bot) + 24px);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--bot) + 110px);background:#3b2b20;color:var(--text);border-radius:14px;padding:14px 16px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:opacity .25s}
.loader{position:fixed;inset:0;background:rgba(13,9,7,.86);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:var(--soft);font-size:15px;text-align:center;padding:24px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line2);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar" aria-label="Main">
  <button class="tab on" data-act="tab-list" id="tabList">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V8l8-4 8 4v12"/><path d="M4 12h16M4 16h16"/></svg>Collection
  </button>
  <button class="fab" data-act="tab-scan" aria-label="Scan a label">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <button class="tab" data-act="tab-settings" id="tabSettings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14 3h-4l-.6 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2L10 21h4l.6-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>Settings
  </button>
</nav>
<input type="file" id="camFront" accept="image/*" capture="environment" class="hidden">
<input type="file" id="camBack" accept="image/*" capture="environment" class="hidden">
<input type="file" id="libPick" accept="image/*" class="hidden">

<script>
/* ===================== Config ===================== */
var DB = 'https://rach-and-vine-default-rtdb.firebaseio.com';
var ROOT = DB + '/bourbon';
var MODEL = 'claude-sonnet-5-5';

/* ===================== State ===================== */
var bottles = {};          // id -> bottle
var photoCache = {};       // id -> {front, back}
var view = 'list';         // list | detail | form | scan | settings
var curId = null;
var filter = 'All';
var query = '';
var heroSide = 'front';
var scan = { front: null, back: null };   // data URLs (resized)
var form = null;           // working copy of a bottle while editing
var formMode = 'add';      // add | edit | review
var flagged = [];          // field keys Claude could not read from the label
var libTarget = 'front';

var FILTERS = ['All', 'Open', 'Sealed', 'Wheated', 'High rye', 'Barrel proof', 'Finished'];

var FIELDS = [
  { k: 'name', label: 'Name', ph: "e.g. Blanton's Original Single Barrel" },
  { k: 'distillery', label: 'Distillery', ph: 'e.g. Buffalo Trace Distillery' },
  { k: 'type', label: 'Style', ph: 'e.g. Kentucky Straight Bourbon' },
  { row: 'three', items: [
    { k: 'proof', label: 'Proof', ph: '90', mode: 'decimal' },
    { k: 'age', label: 'Age (yrs)', ph: 'NAS', mode: 'decimal' },
    { k: 'size', label: 'Size', ph: '750 ml' }
  ]},
  { k: 'mashBill', label: 'Mash bill', ph: 'e.g. high rye, wheated, 75/13/12' },
  { row: 'three', items: [
    { k: 'barrel', label: 'Barrel #', ph: '' },
    { k: 'rick', label: 'Rick #', ph: '' },
    { k: 'warehouse', label: 'Warehouse', ph: '' }
  ]},
  { k: 'dumped', label: 'Dumped / bottled on', ph: 'From the label' },
  { row: 'two', items: [
    { k: 'purchased', label: 'Purchased', ph: '', type: 'date' },
    { k: 'price', label: 'Paid ($)', ph: '', mode: 'decimal' }
  ]},
  { k: 'location', label: 'Shelf / location', ph: 'e.g. Bar cart, top shelf' },
  { k: 'status', label: 'Status', select: [['sealed', 'Sealed'], ['open', 'Open'], ['finished', 'Finished']] },
  { k: 'notes', label: 'Notes', ph: 'Anything worth remembering', area: true }
];
var SCAN_KEYS = ['name', 'distillery', 'type', 'proof', 'age', 'size', 'mashBill', 'barrel', 'rick', 'warehouse', 'dumped'];

/* ===================== Helpers ===================== */
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function num(v) { var n = parseFloat(v); return isNaN(n) ? null : n; }
function toast(msg, ms) {
  var t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(function () { t.style.opacity = '0'; setTimeout(function () { t.remove(); }, 300); }, ms || 2600);
}
function loading(on, msg) {
  var el = $('loader');
  if (!on) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'loader'; el.className = 'loader'; document.body.appendChild(el); }
  el.innerHTML = '<div class="spin"></div><div>' + esc(msg || 'Working…') + '</div>';
}
function icon(name) {
  var p = {
    back: '<path d="M15 18l-6-6 6-6"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/>',
    spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>'
  }[name];
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
}
function bottleSvg(w, h) {
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 26 46" aria-hidden="true"><rect x="10" y="1" width="6" height="9" rx="1.5" fill="#6b4a2f"/><path d="M8 10h10l3 7v26a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V17z" fill="#8a5a2b"/><rect x="7" y="22" width="12" height="11" rx="1" fill="#e9d9c3"/></svg>';
}

/* ===================== Firebase (REST) ===================== */
function fb(path, method, body) {
  var opts = { method: method || 'GET' };
  if (body !== undefined) { opts.body = JSON.stringify(body); opts.headers = { 'Content-Type': 'application/json' }; }
  return fetch(ROOT + path + '.json', opts).then(function (r) {
    if (!r.ok) throw new Error('Firebase ' + r.status);
    return r.json();
  });
}
function loadAll() {
  return fb('/bottles').then(function (data) { bottles = data || {}; });
}
function getPhotos(id) {
  if (photoCache[id]) return Promise.resolve(photoCache[id]);
  return fb('/photos/' + id).then(function (p) { photoCache[id] = p || {}; return photoCache[id]; })
    .catch(function () { return {}; });
}
var apiKey = null;
function getApiKey() {
  if (apiKey) return Promise.resolve(apiKey);
  return fetch(DB + '/config/apiKey.json').then(function (r) { return r.json(); }).then(function (k) {
    if (!k) throw new Error('No Claude API key found in Firebase at /config/apiKey');
    apiKey = k; return k;
  });
}

/* ===================== Images ===================== */
function resizeFile(file, maxSide, quality) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var s = Math.min(1, maxSide / Math.max(img.width, img.height));
      var c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Could not read that image')); };
    img.src = url;
  });
}
function shrinkDataUrl(dataUrl, maxSide, quality) {
  return fetch(dataUrl).then(function (r) { return r.blob(); }).then(function (b) { return resizeFile(b, maxSide, quality); });
}

/* ===================== Derived ===================== */
function list() {
  return Object.keys(bottles).map(function (id) { var b = bottles[id]; b.id = id; return b; });
}
function isWheated(b) { return /wheat/i.test(b.mashBill || '') || /weller|maker'?s mark|larceny|old fitzgerald|pappy|van winkle/i.test(b.name || ''); }
function isHighRye(b) { return /high[\s-]*rye/i.test(b.mashBill || ''); }
function isBarrelProof(b) { return (num(b.proof) || 0) >= 110 || /barrel proof|cask strength|full proof|rare breed|stagg/i.test((b.name || '') + ' ' + (b.type || '')); }
function matches(b) {
  var st = b.status || 'sealed';
  if (filter === 'Finished') { if (st !== 'finished') return false; }
  else {
    if (st === 'finished') return false;
    if (filter === 'Open' && st !== 'open') return false;
    if (filter === 'Sealed' && st !== 'sealed') return false;
    if (filter === 'Wheated' && !isWheated(b)) return false;
    if (filter === 'High rye' && !isHighRye(b)) return false;
    if (filter === 'Barrel proof' && !isBarrelProof(b)) return false;
  }
  var q = query.trim().toLowerCase();
  if (!q) return true;
  var hay = [b.name, b.distillery, b.type, b.mashBill, b.location, b.notes, b.barrel, b.proof].join(' ').toLowerCase();
  return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
}
function score(b) {
  var q = query.trim().toLowerCase();
  if (!q) return 0;
  var n = (b.name || '').toLowerCase(), s = 0;
  q.split(/\s+/).forEach(function (w) { if (n.indexOf(w) === 0) s += 3; else if (n.indexOf(w) >= 0) s += 2; });
  return s;
}
function metaLine(b) {
  var parts = [];
  if (b.distillery) parts.push(b.distillery.replace(/ Distillery$/i, ''));
  if (num(b.age)) parts.push(num(b.age) + ' yr');
  else if (b.mashBill) parts.push(b.mashBill);
  return parts.join(' · ') || '—';
}

/* ===================== Render ===================== */
function render() {
  var app = $('app');
  $('tabbar').classList.toggle('hidden', view === 'detail' || view === 'form' || view === 'scan');
  $('tabList').classList.toggle('on', view === 'list');
  $('tabSettings').classList.toggle('on', view === 'settings');
  if (view === 'list') app.innerHTML = listView();
  else if (view === 'detail') app.innerHTML = detailView();
  else if (view === 'form') app.innerHTML = formView();
  else if (view === 'scan') app.innerHTML = scanView();
  else if (view === 'settings') app.innerHTML = settingsView();
  if (view === 'list') { renderCards(); loadThumbs(); }
  if (view === 'detail') loadHero();
  window.scrollTo(0, 0);
}

    '<header class="top">' +

      '<div class="stats">' +

        '<div class="stat"><b>' + open + '</b><span>Open</span></div>' +
        '<div class="stat"><b>' + (active.length - open) + '</b><span>Sealed</span></div>' +

      '<div class="chips" role="group" aria-label="Filter">' +
        FILTERS.map(function (f) {

        }).join('') +

function renderCards() {
  var el = $('cards'); if (!el) return;
  var items = list().filter(matches).sort(function (a, b) {
    return (score(b) - score(a)) || (a.name || '').localeCompare(b.name || '');
  });
  if (!items.length) {
    var none = !Object.keys(bottles).length;
    el.innerHTML = '<div class="empty">' +
      (none ? '<div class="serif" style="font-size:20px;color:var(--text)">Your shelf is empty</div><div>Tap the amber button to scan your first label.</div>'
            : '<div>No bottles match.</div>') + '</div>';
    return;
  }
  el.innerHTML = items.map(function (b) {
    var st = b.status || 'sealed';
    var fill = st === 'sealed' ? 100 : (num(b.fill) == null ? 100 : num(b.fill));
    var color = st === 'open' ? 'var(--accent)' : 'var(--sealed)';
    var label = st === 'sealed' ? 'Sealed' : st === 'finished' ? 'Finished' : fill + '%';
    return '<button class="card" data-act="open" data-id="' + esc(b.id) + '">' +
      '<div class="thumb" data-thumb="' + esc(b.id) + '">' + (photoCache[b.id] && photoCache[b.id].front ? '<img alt="" src="' + photoCache[b.id].front + '">' : bottleSvg(26, 46)) + '</div>' +
      '<div class="info"><span class="name">' + esc(b.name || 'Unnamed bottle') + '</span>' +
        '<span class="meta">' + esc(metaLine(b)) + '</span>' +
        '<span class="row" style="gap:8px;margin-top:2px"><span class="bar"><i style="width:' + fill + '%;background:' + color + '"></i></span><span class="status">' + label + '</span></span>' +
      '</div>' +
      (b.proof ? '<span class="pill">' + esc(b.proof) + '</span>' : '') +
    '</button>';

}

/* Thumbnails load after the list paints so the list stays fast. */
function loadThumbs() {
  var ids = Object.keys(bottles).filter(function (id) { return bottles[id].hasPhoto && !photoCache[id]; });
  ids.forEach(function (id) {
    getPhotos(id).then(function (p) {
      var el = document.querySelector('[data-thumb="' + id + '"]');
      if (el && p.front) el.innerHTML = '<img alt="" src="' + p.front + '">';
    });
  });
}

function loadHero() {

    var hero = $('hero'); if (!hero || view !== 'detail') return;

      }).join('');

function fieldHtml(f) {

  } else {

function formView() {
  var title = formMode === 'edit' ? 'Edit bottle' : formMode === 'review' ? 'Check the details' : 'Add a bottle';
  var sub = formMode === 'review' ? 'Read from your label photos' : formMode === 'edit' ? esc(form.name || '') : 'Enter what you know';
  var html = '<div class="screen" style="padding-bottom:calc(var(--bot) + 110px)">' +

      '<div style="display:flex;flex-direction:column;min-width:0"><h2>' + title + '</h2><span style="font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + sub + '</span></div></div>' +
    '<div class="fields">';

      '<button class="btn primary" data-act="save">' + (formMode === 'edit' ? 'Save changes' : 'Add to collection') + '</button>' +

           : '<span class="corners" aria-hidden="true"><i></i><i></i><i></i><i></i></span>' +
             '<span style="width:34px;height:34px;color:var(--accent)">' + icon('camera') + '</span>' + (side === 'front' ? 'Front label' : 'Back label') +
             '<span style="font-weight:400;font-size:12px;color:var(--muted)">' + (side === 'front' ? 'Required' : 'Optional') + '</span>') +
    '</button>';
  }
  return '<div class="scan">' +
    '<div class="formtop"><button class="iconbtn" data-act="closeScan" aria-label="Close scanner">' + icon('close') + '</button>' +
      '<h2 style="flex:1;text-align:center">Scan a label</h2>' +
      '<button class="iconbtn" data-act="library" aria-label="Choose photo from library">' + icon('image') + '</button></div>' +
    '<div class="slots">' + slot('front') + slot('back') + '</div>' +
    '<div class="scanhint">Fill the frame with the label. The back label often has the barrel, rick and warehouse numbers.</div>' +
    '<div class="scanactions">' +
      '<button class="btn primary" data-act="read"' + (scan.front ? '' : ' disabled') + '>Read the labels</button>' +

  '</div>';
}

function settingsView() {
  var all = list();
  var fin = all.filter(function (b) { return b.status === 'finished'; }).length;
  return '<div class="screen"><header class="top"><h1>Settings</h1></header>' +
    '<div class="pad" style="display:flex;flex-direction:column;gap:12px">' +
      '<div class="kv"><div><span>Bottles on the shelf</span><span>' + (all.length - fin) + '</span></div><div><span>Finished</span><span>' + fin + '</span></div></div>' +
      '<button class="btn" data-act="csv">Export collection (CSV)</button>' +
      '<button class="btn" data-act="reload">Refresh from cloud</button>' +
      '<p style="font-size:12px;color:var(--muted);line-height:1.5;margin:4px 2px">Synced through Firebase under /bourbon. Label reading uses Claude with the API key stored in Firebase.</p>' +
    '</div></div>';
}

/* ===================== Label reading (Claude vision) ===================== */
var SCAN_PROMPT =
  'You are reading photos of a bourbon/whiskey bottle label (front, and back if provided). ' +
  'Return ONLY a JSON object, no prose, with these string keys: ' +
  'name (full product name as marketed), distillery, type (e.g. "Kentucky Straight Bourbon Whiskey"), ' +
  'proof (number only, e.g. "93"; if only ABV is shown, proof = ABV x 2), age (years as a number, or "" if no age statement), ' +
  'size (e.g. "750 ml"), mashBill (e.g. "high rye", "wheated", or a recipe like "75% corn, 13% rye, 12% barley"), ' +
  'barrel, rick, warehouse (as printed, e.g. Blanton\'s labels), dumped (dumped/bottled date as printed). ' +
  'Also return "fromLabel": an array of the keys whose values you actually read from the photos. ' +
  'For keys not printed on the label, you may fill in widely known facts about this product (for example its mash bill), ' +
  'but leave them out of fromLabel. Use "" for anything you do not know. Never guess barrel, rick, warehouse or dumped.';

function readLabels() {
  if (!scan.front) return;
  loading(true, 'Reading your label…');
  var imgs = [scan.front, scan.back].filter(Boolean);
  getApiKey().then(function (key) {
    var content = imgs.map(function (d) {
      return { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: d.split(',')[1] } };
    });
    content.push({ type: 'text', text: SCAN_PROMPT });
    return fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({ model: MODEL, max_tokens: 1200, messages: [{ role: 'user', content: content }] })
    });
  }).then(function (r) {
    return r.json().then(function (j) {
      if (!r.ok) throw new Error((j.error && j.error.message) || ('Claude API ' + r.status));
      return j;
    });
  }).then(function (j) {
    var text = (j.content || []).filter(function (c) { return c.type === 'text'; }).map(function (c) { return c.text; }).join('');
    var m = text.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('Could not understand the label reading');
    var data = JSON.parse(m[0]);
    var from = Array.isArray(data.fromLabel) ? data.fromLabel : [];
    form = blankBottle();
    SCAN_KEYS.forEach(function (k) { if (data[k] != null) form[k] = String(data[k]).trim(); });
    flagged = SCAN_KEYS.filter(function (k) { return form[k] && from.indexOf(k) < 0; });
    formMode = 'review';
    loading(false);
    view = 'form'; render();
  }).catch(function (e) {
    loading(false);
    toast('Label reading failed: ' + e.message + '. You can fill it in by hand.', 4500);
    form = blankBottle(); flagged = []; formMode = 'review'; view = 'form'; render();
  });
}

/* ===================== Actions ===================== */
function blankBottle() { return { status: 'sealed', fill: 100, size: '750 ml' }; }

function collectForm() {
  document.querySelectorAll('[data-k]').forEach(function (el) {
    var v = el.value.trim();
    if (v) form[el.dataset.k] = v; else delete form[el.dataset.k];
  });
}

function save() {
  collectForm();
  if (!form.name) { toast('Give the bottle a name first.'); var n = $('f_name'); if (n) n.focus(); return; }
  var id = form.id || newId();
  var rec = {};
  Object.keys(form).forEach(function (k) { if (k !== 'id' && form[k] !== '' && form[k] != null) rec[k] = form[k]; });
  if (rec.status === 'sealed') rec.fill = 100;
  if (rec.status === 'open' && rec.fill == null) rec.fill = 100;
  if (!rec.createdAt) rec.createdAt = Date.now();
  rec.updatedAt = Date.now();
  var hadScan = !!(scan.front || scan.back);
  if (hadScan) rec.hasPhoto = true;
  loading(true, 'Saving…');
  var p = Promise.resolve();
  if (hadScan) {
    // Store smaller copies so the database stays light
    p = Promise.all([scan.front ? shrinkDataUrl(scan.front, 900, 0.72) : null, scan.back ? shrinkDataUrl(scan.back, 900, 0.72) : null])
      .then(function (r) {
        var ph = {}; if (r[0]) ph.front = r[0]; if (r[1]) ph.back = r[1];
        photoCache[id] = ph;
        return fb('/photos/' + id, 'PUT', ph);
      });
  }
  p.then(function () { return fb('/bottles/' + id, 'PUT', rec); }).then(function () {
    bottles[id] = rec;
    loading(false);
    scan = { front: null, back: null }; flagged = []; form = null;
    curId = id; heroSide = 'front'; view = 'detail'; render();
    toast(formMode === 'edit' ? 'Saved.' : 'Added to your shelf.');
  }).catch(function (e) { loading(false); toast('Save failed: ' + e.message, 4000); });
}

function patchBottle(id, changes) {
  Object.assign(bottles[id], changes, { updatedAt: Date.now() });
  return fb('/bottles/' + id, 'PATCH', Object.assign({}, changes, { updatedAt: bottles[id].updatedAt }))
    .catch(function (e) { toast('Sync failed: ' + e.message, 4000); });
}

function exportCsv() {
  var cols = ['name', 'distillery', 'type', 'proof', 'age', 'size', 'mashBill', 'barrel', 'rick', 'warehouse', 'dumped', 'purchased', 'price', 'location', 'status', 'fill', 'notes'];
  var lines = [cols.join(',')].concat(list().map(function (b) {
    return cols.map(function (c) { var v = b[c] == null ? '' : String(b[c]); return '"' + v.replace(/"/g, '""') + '"'; }).join(',');
  }));
  var blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'rickhouse-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

function takePhoto(side, file) {
  if (!file) return;
  loading(true, 'Preparing photo…');
  resizeFile(file, 1500, 0.85).then(function (d) {
    scan[side] = d; loading(false);
    if (view === 'scan') render();
  }).catch(function (e) { loading(false); toast(e.message); });
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return;
  var act = t.dataset.act, v = t.dataset.v;
  switch (act) {
    case 'tab-list': view = 'list'; render(); break;
    case 'tab-settings': view = 'settings'; render(); break;
    case 'tab-scan':
      if (view === 'form') collectForm();
      if (view !== 'form') scan = { front: null, back: null };
      view = 'scan'; render(); break;
    case 'filter': filter = v; render(); break;
    case 'open': curId = t.dataset.id; heroSide = 'front'; view = 'detail'; render(); break;
    case 'back': view = 'list'; render(); break;
    case 'side': heroSide = v; loadHero(); break;
    case 'add': form = blankBottle(); flagged = []; formMode = 'add'; scan = { front: null, back: null }; view = 'form'; render(); break;
    case 'edit': form = Object.assign({}, bottles[curId], { id: curId }); flagged = []; formMode = 'edit'; scan = { front: null, back: null }; view = 'form'; render(); break;
    case 'cancelForm':
      scan = { front: null, back: null }; flagged = [];
      view = formMode === 'edit' ? 'detail' : 'list'; form = null; render(); break;
    case 'save': save(); break;
    case 'status':
      var ch = { status: v };
      if (v === 'sealed') ch.fill = 100;
      if (v === 'open' && bottles[curId].status !== 'open') ch.fill = 100;
      if (v === 'finished') ch.fill = 0;
      patchBottle(curId, ch); render(); break;
    case 'delete':
      if (confirm('Delete ' + (bottles[curId].name || 'this bottle') + '? This can’t be undone.')) {
        var id = curId;
        Promise.all([fb('/bottles/' + id, 'DELETE'), fb('/photos/' + id, 'DELETE')]).then(function () {
          delete bottles[id]; delete photoCache[id]; view = 'list'; render(); toast('Deleted.');
        }).catch(function (err) { toast('Delete failed: ' + err.message, 4000); });
      }
      break;
    case 'shoot': $(v === 'back' ? 'camBack' : 'camFront').click(); break;
    case 'library': libTarget = scan.front ? 'back' : 'front'; $('libPick').click(); break;
    case 'closeScan': scan = { front: null, back: null }; view = 'list'; render(); break;
    case 'skipScan': form = blankBottle(); flagged = []; formMode = scan.front ? 'review' : 'add'; view = 'form'; render(); break;
    case 'read': readLabels(); break;
    case 'csv': exportCsv(); break;
    case 'reload':
      loading(true, 'Refreshing…');
      loadAll().then(function () { loading(false); toast('Up to date.'); render(); })
        .catch(function (err) { loading(false); toast('Refresh failed: ' + err.message, 4000); });
      break;
  }
});

document.addEventListener('input', function (e) {
  if (e.target.id === 'q') { query = e.target.value; renderCards(); loadThumbs(); }
  if (e.target.id === 'fill') { var l = $('fillLbl'); if (l) l.textContent = e.target.value + '%'; }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'fill') patchBottle(curId, { fill: Number(e.target.value) });
  if (e.target.id === 'camFront') { takePhoto('front', e.target.files[0]); e.target.value = ''; }
  if (e.target.id === 'camBack') { takePhoto('back', e.target.files[0]); e.target.value = ''; }
  if (e.target.id === 'libPick') { takePhoto(libTarget, e.target.files[0]); e.target.value = ''; }
});

/* ===================== Home-screen icon ===================== */
function drawIcon() {
  // Option C: barrel head stamped with an R
  var c = document.createElement('canvas'); c.width = c.height = 180;
  var x = c.getContext('2d');
  x.fillStyle = '#2a1e16'; x.fillRect(0, 0, 180, 180);
  x.save();
  x.beginPath(); x.arc(90, 90, 66, 0, Math.PI * 2); x.fillStyle = '#8a5a2b'; x.fill(); x.clip();
  x.strokeStyle = '#6e4522'; x.lineWidth = 2;
  [60, 78, 96, 114, 132].forEach(function (sx) { x.beginPath(); x.moveTo(sx, 20); x.lineTo(sx, 160); x.stroke(); });
  x.restore();
  x.beginPath(); x.arc(90, 90, 66, 0, Math.PI * 2); x.strokeStyle = '#2f231b'; x.lineWidth = 9; x.stroke();
  x.beginPath(); x.arc(90, 90, 54, 0, Math.PI * 2); x.strokeStyle = '#5a3a1e'; x.lineWidth = 2; x.stroke();
  x.globalAlpha = 0.92; x.fillStyle = '#f3e9df'; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.font = '700 56px Fraunces, Georgia, serif'; x.fillText('R', 90, 109);
  x.globalAlpha = 1;
  x.beginPath(); x.arc(90, 134, 4, 0, Math.PI * 2); x.fillStyle = '#3a2410'; x.fill();
  var url = c.toDataURL('image/png');
  $('touchIcon').href = url;
  var man = { name: 'Rickhouse', short_name: 'Rickhouse', display: 'standalone', background_color: '#17110d', theme_color: '#17110d',
    start_url: location.href.split('#')[0], icons: [{ src: url, sizes: '180x180', type: 'image/png' }] };
  var l = document.createElement('link'); l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/json' }));
  document.head.appendChild(l);
}

/* ===================== Start ===================== */
// Wait briefly for Fraunces so the R on the icon uses it
(document.fonts && document.fonts.load ? Promise.race([document.fonts.load('700 56px Fraunces'), new Promise(function (r) { setTimeout(r, 1500); })]) : Promise.resolve())
  .then(drawIcon, drawIcon);
render();
loadAll().then(render).catch(function (e) { toast('Could not reach Firebase: ' + e.message, 5000); });
</script>
